name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

# `shell: bash` is "bash -eo pipefail": a step that pipes a command into `tee` fails when the command does. Without it
# (the default shell is "bash -e") the status of `./tests/run_tests.sh ... | tee test.log` is tee's, and a failed test passes.
defaults:
  run:
    shell: bash

env:
  # tests/run_tests.sh skips the comparisons with a judge that is not there; here, where every judge is built or installed,
  # a missing one is a failure (a skipped comparison would pass unseen).
  ABR_REQUIRE_ORACLES: futility,cpio,rkcrc,blobtools,mboot,loki,pxa,sony_dump,elftool

# abr is C++26: GCC >= 14 and Clang >= 17 have the mode, the Ubuntu 24.04 default
# GCC 13 does not (see CMakeLists.txt), so every job names its compiler.
jobs:
  linux-x86_64:
    name: linux-x86_64 (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc-14,   cxx: g++-14,     package: true }
          - { cc: clang-20, cxx: clang++-20, package: false }
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools + test-suite oracles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build python3 python3-pip device-tree-compiler \
            u-boot-tools openssl lz4 zstd xz-utils bzip2 lzop liblzo2-dev default-jdk-headless \
            libbcprov-java g++-14 clang-20 cpio vboot-kernel-utils zlib1g-dev
          pip3 install --break-system-packages python-lzo
          # (vboot-kernel-utils: `futility`, the tool Android Image Kitchen runs for a ChromeOS kernel blob -- a judge
          # of the ChromeOS tests, found on the PATH; where it is missing they are judged by the Python tool alone)

      # The judges of the suite -- rkcrc, blobpack and blobunpack, mboot, loki_tool, pxa-mkbootimg and pxa-unpackbootimg,
      # sony_dump, elftool -- are fetched at pinned commits and compiled here (.github/scripts/build_oracles.sh). None is
      # part of this repository and several have no licence file: the suite only runs them, nothing of them goes into abr.
      # A judge that cannot be built does not stop the job here; ABR_REQUIRE_ORACLES makes the test step fail for it.
      - name: Build the judges of the test suite from their sources
        continue-on-error: true
        run: .github/scripts/build_oracles.sh "$RUNNER_TEMP/oracles" | tee -a "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DABR_STATIC_BINARY=ON

      - name: Build
        run: cmake --build build -j 2>&1 | tee build.log

      - name: Post build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/post_failure_log.py "linux-x86_64 (${{ matrix.cxx }})" build.log

      - name: Test (byte-identical round trips against real reference tools)
        run: ./tests/run_tests.sh build/abr 2>&1 | tee test.log

      - name: Post test log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/post_failure_log.py "linux-x86_64 (${{ matrix.cxx }}) test" test.log

      - name: Test result (an annotation of the job)
        if: ${{ always() && hashFiles('test.log') != '' }}
        run: python3 .github/scripts/test_summary.py "linux-x86_64 (${{ matrix.cxx }})" test.log

      - name: Verify static linking
        run: |
          file build/abr
          # (ldd says "not a dynamic executable" and exits 1 for what is static: its status is not the answer)
          ldd_said=$(ldd build/abr 2>&1 || true)
          if grep -q "not a dynamic executable" <<<"$ldd_said"; then
            echo "OK: fully static"
          else
            echo "expected a fully static binary:"; echo "$ldd_said"; exit 1
          fi

      - name: Package
        if: matrix.package
        run: |
          mkdir -p dist
          cp build/abr dist/abr-linux-x86_64
          cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@v4
        if: matrix.package
        with:
          name: abr-linux-x86_64
          path: |
            dist/abr-linux-x86_64
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md

  # The suite, and then a short run of tests/tools/fuzz_images.py on the images the suite made, against a build with
  # AddressSanitizer and UndefinedBehaviorSanitizer (abr's own code: -DABR_SANITIZE=address,undefined). What a green suite
  # does not show -- a read past the end of a damaged image, a size that is trusted before it is checked, a signed overflow in
  # an offset, a leak -- stops a run with a report. During the suite the reports go to files (a test that expects an error
  # would take the sanitizer's exit status for the error it wants) and any file there fails the job; the fuzzer reads them
  # from the stderr of the runs itself.
  linux-x86_64-sanitizers:
    name: linux-x86_64 (g++-14, ASan+UBSan)
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:log_path=/tmp/abr-sanitizer/asan
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:log_path=/tmp/abr-sanitizer/ubsan
      ABR_KEEP_WORK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools + test-suite oracles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build python3 python3-pip device-tree-compiler \
            u-boot-tools openssl lz4 zstd xz-utils bzip2 lzop liblzo2-dev default-jdk-headless \
            libbcprov-java g++-14 cpio vboot-kernel-utils zlib1g-dev
          pip3 install --break-system-packages python-lzo

      - name: Build the judges of the test suite from their sources
        continue-on-error: true
        run: .github/scripts/build_oracles.sh "$RUNNER_TEMP/oracles" | tee -a "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DABR_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build-asan -j 2>&1 | tee build.log

      - name: Post build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/post_failure_log.py "linux-x86_64 (g++-14, ASan+UBSan)" build.log

      - name: Test (the suite against the sanitizer build)
        run: |
          mkdir -p /tmp/abr-sanitizer
          ./tests/run_tests.sh build-asan/abr 2>&1 | tee test.log

      - name: Post test log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/post_failure_log.py "linux-x86_64 (g++-14, ASan+UBSan) test" test.log

      - name: Test result (an annotation of the job)
        if: ${{ always() && hashFiles('test.log') != '' }}
        run: python3 .github/scripts/test_summary.py "linux-x86_64 (g++-14, ASan+UBSan)" test.log

      - name: Sanitizer reports of the suite
        if: always()
        run: |
          if compgen -G "/tmp/abr-sanitizer/*" >/dev/null; then
            for f in /tmp/abr-sanitizer/*; do echo "=== $f"; head -c 6000 "$f"; done | tee sanitizer.log
            exit 1
          fi
          echo "no sanitizer report"

      - name: Post sanitizer reports on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f sanitizer.log ] && python3 .github/scripts/post_failure_log.py "linux-x86_64 (g++-14, ASan+UBSan) sanitizer reports" sanitizer.log || true

      # Damaged copies of every image the suite made (it keeps its work directory under ABR_KEEP_WORK): abr must refuse or
      # take each one, not crash, hang, run out of memory or make a sanitizer say anything.
      - name: Fuzz the images the suite made
        run: |
          work=$(sed -n 's/^note: the work directory is kept: //p' test.log | head -n 1)
          test -d "$work"
          python3 tests/tools/fuzz_images.py --abr build-asan/abr --seeds "$work" --iterations 4 \
            --time-limit 1200 --timeout 120 --findings fuzz-findings 2>&1 | tee fuzz.log

      - name: Post fuzz findings on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f fuzz.log ] && python3 .github/scripts/post_failure_log.py "linux-x86_64 (g++-14, ASan+UBSan) fuzz" fuzz.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: fuzz-findings
          if-no-files-found: ignore

  windows-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Clang + the distribution's mingw-w64 runtime: a C++26 compiler for
      # Windows without downloading a toolchain (Ubuntu's mingw GCC is 13).
      # wine runs the resulting .exe through the same test suite.
      - name: Install the cross toolchain, wine and the test-suite oracles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang-20 lld-20 mingw-w64 \
            g++-mingw-w64-x86-64-posix wine64 python3 python3-pip device-tree-compiler \
            u-boot-tools openssl lz4 zstd xz-utils bzip2 lzop liblzo2-dev default-jdk-headless \
            libbcprov-java cpio vboot-kernel-utils zlib1g-dev
          pip3 install --break-system-packages python-lzo

      # The judges of the suite -- rkcrc, blobpack and blobunpack, mboot, loki_tool, pxa-mkbootimg and pxa-unpackbootimg,
      # sony_dump, elftool -- are fetched at pinned commits and compiled here (.github/scripts/build_oracles.sh). None is
      # part of this repository and several have no licence file: the suite only runs them, nothing of them goes into abr.
      # A judge that cannot be built does not stop the job here; ABR_REQUIRE_ORACLES makes the test step fail for it.
      - name: Build the judges of the test suite from their sources
        continue-on-error: true
        run: .github/scripts/build_oracles.sh "$RUNNER_TEMP/oracles" | tee -a "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build-windows -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-clang.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DABR_STATIC_BINARY=ON

      - name: Build
        run: cmake --build build-windows -j 2>&1 | tee build.log

      - name: Post build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/post_failure_log.py "windows-x86_64" build.log

      - name: Test (abr.exe under wine)
        env:
          WINEDEBUG: "-all"
        run: ./tests/run_tests.sh build-windows/abr.exe 2>&1 | tee test.log

      - name: Post test log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/post_failure_log.py "windows-x86_64 test" test.log

      - name: Test result (an annotation of the job)
        if: ${{ always() && hashFiles('test.log') != '' }}
        run: python3 .github/scripts/test_summary.py "windows-x86_64" test.log

      - name: Verify the executable is self-contained
        run: |
          x86_64-w64-mingw32-objdump -p build-windows/abr.exe | grep "DLL Name" | sort -u | tee dlls.txt
          # Only the system DLLs every Windows has; no MinGW runtime DLL (libstdc++, libgcc, winpthread).
          if grep -v -i -E "DLL Name: (KERNEL32|msvcrt|ADVAPI32|USER32|SHELL32|ucrtbase|api-ms-win-crt-[a-z-]+-l[0-9]-[0-9]-[0-9])\.dll" dlls.txt; then
            echo "unexpected DLL dependency"; exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp build-windows/abr.exe dist/abr-windows-x86_64.exe
          cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: abr-windows-x86_64
          path: |
            dist/abr-windows-x86_64.exe
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md

  # The arm64 code (ARMv8 SHA instructions, NEON, the 64-bit ARM ABI) is run for
  # real: a static aarch64 build executed under qemu-user through the same suite.
  linux-arm64-qemu:
    name: linux-arm64 (g++-14, qemu-user)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross toolchain, qemu and the test-suite oracles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++-14-aarch64-linux-gnu qemu-user python3 \
            python3-pip device-tree-compiler u-boot-tools openssl lz4 zstd xz-utils bzip2 lzop \
            liblzo2-dev default-jdk-headless libbcprov-java cpio vboot-kernel-utils zlib1g-dev
          pip3 install --break-system-packages python-lzo

      # The judges of the suite -- rkcrc, blobpack and blobunpack, mboot, loki_tool, pxa-mkbootimg and pxa-unpackbootimg,
      # sony_dump, elftool -- are fetched at pinned commits and compiled here (.github/scripts/build_oracles.sh). None is
      # part of this repository and several have no licence file: the suite only runs them, nothing of them goes into abr.
      # A judge that cannot be built does not stop the job here; ABR_REQUIRE_ORACLES makes the test step fail for it.
      - name: Build the judges of the test suite from their sources
        continue-on-error: true
        run: .github/scripts/build_oracles.sh "$RUNNER_TEMP/oracles" | tee -a "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build-arm64 -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DABR_STATIC_BINARY=ON

      - name: Build
        run: cmake --build build-arm64 -j 2>&1 | tee build.log

      - name: Post build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/post_failure_log.py "linux-arm64-qemu" build.log

      - name: Test (the arm64 binary under qemu-user, with the ARMv8 SHA instructions)
        env:
          ABR_RUNNER: qemu-aarch64 -cpu max
        run: ./tests/run_tests.sh build-arm64/abr 2>&1 | tee test.log

      - name: Post test log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/post_failure_log.py "linux-arm64-qemu test" test.log

      - name: Test result (an annotation of the job)
        if: ${{ always() && hashFiles('test.log') != '' }}
        run: python3 .github/scripts/test_summary.py "linux-arm64 (g++-14, qemu-user)" test.log

  android-arm64:
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: r29
    steps:
      - uses: actions/checkout@v4

      - name: Install cmake/ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build

      - name: Download Android NDK
        run: |
          curl -fL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build-android -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/android-arm64.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DABR_STATIC_BINARY=ON

      - name: Build
        run: cmake --build build-android -j 2>&1 | tee build.log

      - name: Post build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/post_failure_log.py "android-arm64" build.log

      - name: Package
        run: |
          mkdir -p dist
          cp build-android/abr dist/abr-android-arm64
          cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: abr-android-arm64
          path: |
            dist/abr-android-arm64
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
